- aid: logz-io:logz-io-manage-time-based-log-accounts-api
  name: Logz.io Manage time-based log accounts API
  description: "Use these API requests to manage time-based log accounts:\n* Create, update, or delete\
    \ a sub account.\n* Allocate daily capacity to the main account and/or sub accounts.\n* Retrieve account\
    \ activity stats and/or account configuration details.\n\n### Flexible storage & shared volume\n \
    \ \nFlexible storage and shared volume allow accounts to share indexing capacity.\n\nTo enable shared\
    \ volume, go to the [Manage accounts page](https://app.logz.io/#/dashboard/settings/manage-accounts)\
    \ in the Logz.io app and toggle the button **Use flexible volume** to turn it on.\n\nTo determine\
    \ whether flexible storage is enabled, run a `Get` request to retrieve account details.\n* If `isFlexible`\
    \ is true, flexible storage is enabled and every account has reserved capacity set by the parameter\
    \ `reservedDailyGB`.\n* If false, flexible storage is disabled and the parameter `reservedDailyGB`\
    \ is null."
