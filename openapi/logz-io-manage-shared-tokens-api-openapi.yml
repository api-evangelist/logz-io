            schema:
              $ref: '#/components/schemas/CreateSharedTokenRequest'
components:
  schemas:
    CreateSharedTokenRequest:
      type: object
      properties:
        tokenName:
          type: string
          default: string
          description: Name of the token
          example: Support team token
        filters:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32
          description: IDs of filters to attach to the token
          example:
          - 339
        filtersOperator:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Logical operator used to combine filters. Possible values can be `OR` or `AND`.
          example: OR
    UpdateSharedTokenRequest:
      type: object
      required:
      - filters
      properties:
        filters:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32
            description: ID of the filter
            example: 339
          description: IDs of filters to attach to the token. To remove all filters, use an empty array `[]`.
        filtersOperator:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Logical operator used to combine filters. Possible values can be `OR` or `AND`.
          example: OR
    SharedToken:
      type: object
      properties:
        id:
          type: integer
          format: int32
          description: ID of the shared token
          example: 1241
        name:
          type: string
          description: Descriptive name of the token
          example: Snapshotting token
        token:
          type: string
          description: The token
          example: 6c36edf51-cf93883aa35-5bc6ce6-7bcfe60d87
        filters:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int32
          description: Array of filter IDs attached to each token. If no filter is attached, `null`.
          example:
          - 339
          - 340
        lastUsed:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
          description: UNIX timestamp in milliseconds. If token wasn't in use, `null`.
          example: 1735743699.0
        expirationDate:
          type: array
          uniqueItems: true
          items:
            type: integer
            format: int64
          description: UNIX timestamp in milliseconds. If token doesn't have expiration date, `null`.
          example: 1735743699.0
        filtersOperator:
          type: array
          uniqueItems: true
          items:
            type: string
          description: Logical operator used to combine filters. Possible values can be `OR` or `AND`.
          example: OR
    QueryFilter:
      type: object
      required:
      - field
      - value
      properties:
        id:
          type: integer
          format: int32
          description: ID of the shared token filter
          example: 339
        field:
          type: string
          pattern: ^[a-zA-Z0-9_@.-]+$
          description: The field to filter
        value:
          type: string
          pattern: ^[a-zA-Z0-9_@.-]+$
          description: The filter query
        description:
          type: string
          description: Name of the filter
          example: 503 responses
  securitySchemes:
    X-API-TOKEN:
      description: 'You can manage your API tokens from the [Logz.io API tokens](https://app.logz.io/#/dashboard/settings/manage-tokens/api) page.


        API tokens are account-specific. You will need to be logged into the relevant Log Management or SIEM account to view the API tokens associated with it.


        To manage your API tokens, log into the relevant account in your Logz.io platform, click the gear in the top-right menu, and select [**Tools > Manage tokens > API tokens**](https://app.logz.io/#/dashboard/settings/manage-tokens/api).


        It''s important to keep your tokens secure. API tokens carry privileges to make changes to users and accounts, so if you believe an API token has been compromised, delete it, and replace it with a new token in your integrations.'
      type: apiKey
      in: header
      name: X-API-TOKEN
