                properties:
                  message:
                    type: string
                    example: token with id 12345 not found for account 54321
                    description: The shared token or query filter could not be found
        403:
          description: forbidden
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    example: Insufficient privileges
                    description: Insufficient privileges. Contact our Support team for access to this API feature.
    post:
      operationId: createToken
      summary: Create a shared token
      description: 'Creates a new shared token.


        **Note:** This endpoint requires permissions that must be set by our Support team. Please email help@logz.io for assistance.

        Please ensure to change the region in the URL to match your account''s region.'
      tags:
      - Manage shared tokens
      responses:
        200:
          description: successful operation
